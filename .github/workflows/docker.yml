name: Build, Push and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t yashdevops1/devops-ai-assistant:latest .

      - name: Push Docker Image
        run: docker push yashdevops1/devops-ai-assistant:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull yashdevops1/devops-ai-assistant:latest

            sudo docker stop aiassistant || true
            sudo docker rm aiassistant || true

            sudo docker run -d \
              --restart unless-stopped \
              --name aiassistant \
              -p 5000:5000 \
              -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
              yashdevops1/devops-ai-assistant:latest

            sudo docker image prune -f
